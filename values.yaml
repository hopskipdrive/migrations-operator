resources:
  limits:
    memory: 512M
  requests:
    cpu: 100m
    memory: 256M

# The manager image is only published for arm64. Pin to the default
# Karpenter node pool (arm64-only in every env) rather than just
# kubernetes.io/arch, since some envs (e.g. internal-auto) also run
# dedicated arm64 runner node pools this shouldn't schedule onto.
# Override, or set to `null` to disable, per-env in infra-monorepo
# helmfile values if a cluster's node pools differ. (Helm deep-merges
# values, so `affinity: {}` will NOT clear this default — use `affinity:
# null`.)
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: karpenter.sh/nodepool
              operator: In
              values:
                - auto-default-nodepool
